<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840" font-family="Lato, DejaVu Sans, sans-serif">
  <!-- Fig v2 (house style): ANP32A species barrier.
       Briefing: how-does-anp32a-determine-the-species-barrier-between-birds-and
       Icons: NIH BioArt (PD) hosts; bioicons/Servier influenza virus (CC BY 3.0,
       recolored single-hue) — see figures/manifests/. -->
  <defs>
    <marker id="gA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="rA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1400" height="840" fill="#f8fafc"/>
  <text x="40" y="58" font-size="31" font-weight="900" fill="#0f172a">One host protein sets the species barrier</text>
  <text x="40" y="88" font-size="16.5" fill="#475569">Avian ANP32A carries a 33-aa insertion that mammalian ANP32A lacks. The avian polymerase needs it;</text>
  <text x="40" y="110" font-size="16.5" fill="#475569">mammalian adaptation (PB2 E627K, cattle M631L) bypasses the block.</text>

  <!-- ============ AVIAN CELL ============ -->
  <g id="avian-card">
    <rect x="40" y="140" width="640" height="500" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="3"/>
    <text x="80" y="186" font-size="20" font-weight="700" fill="#1d4ed8">AVIAN CELL (chicken)</text>
    <image href="assets/fig-anp32a-species-barrier/000133_domestic-chicken-silhouette_g589.svg" x="560" y="150" width="86" height="86"/>

    <text x="110" y="252" font-size="14" font-weight="700" fill="#0f172a">ANP32A</text>
    <rect x="110" y="264" width="120" height="44" rx="9" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="254" y="264" width="96" height="44" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="302" y="291" font-size="13" font-weight="700" fill="#451a03" text-anchor="middle">33-aa insert</text>
    <rect x="374" y="264" width="150" height="44" rx="9" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
    <text x="470" y="322" font-size="12.5" fill="#475569">insert + central domain</text>

    <image href="assets/fig-anp32a-species-barrier/influenza-virus-6883e674.svg" x="104" y="376" width="58" height="58"/>
    <text x="180" y="402" font-size="14" font-weight="700" fill="#0f172a">viral polymerase</text>
    <text x="180" y="422" font-size="12.5" fill="#475569">PB1 + PA · PB2 627E</text>
    <rect x="110" y="440" width="130" height="44" rx="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
    <text x="175" y="467" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">PB1 + PA</text>
    <rect x="270" y="440" width="120" height="44" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="330" y="467" font-size="14" font-weight="700" fill="#451a03" text-anchor="middle">PB2 627E</text>

    <path d="M 330 440 L 330 400 Q 330 380 308 378 L 306 316" fill="none" stroke="#16a34a" stroke-width="4" marker-end="url(#gA)"/>
    <text x="440" y="396" font-size="15.5" font-weight="700" fill="#166534">fits &amp; supports</text>
    <text x="440" y="417" font-size="13" fill="#166534">627E engages the insert</text>

    <rect x="80" y="540" width="560" height="72" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.4"/>
    <text x="360" y="570" font-size="18" font-weight="900" fill="#14532d" text-anchor="middle">✓ Polymerase active — robust avian replication</text>
    <text x="360" y="594" font-size="13" fill="#166534" text-anchor="middle">chicken ANP32A uniquely permissive · chicken ANP32B non-functional</text>
  </g>

  <!-- ============ MAMMALIAN CELL ============ -->
  <g id="mammalian-card">
    <rect x="720" y="140" width="640" height="500" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="3"/>
    <text x="760" y="186" font-size="20" font-weight="700" fill="#b91c1c">MAMMALIAN CELL (human)</text>

    <text x="790" y="252" font-size="14" font-weight="700" fill="#0f172a">ANP32A (mammalian)</text>
    <rect x="790" y="264" width="120" height="44" rx="9" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
    <rect x="934" y="264" width="70" height="44" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="969" y="291" font-size="11.5" fill="#64748b" text-anchor="middle">no insert</text>
    <rect x="1034" y="264" width="150" height="44" rx="9" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>

    <image href="assets/fig-anp32a-species-barrier/influenza-virus-6883e674.svg" x="784" y="376" width="58" height="58"/>
    <text x="860" y="402" font-size="14" font-weight="700" fill="#0f172a">avian 627E polymerase</text>
    <g opacity="0.6">
      <rect x="790" y="440" width="130" height="44" rx="9" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
      <text x="855" y="467" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">PB1 + PA</text>
      <rect x="950" y="440" width="120" height="44" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
      <text x="1010" y="467" font-size="14" font-weight="700" fill="#451a03" text-anchor="middle">PB2 627E</text>
    </g>
    <path d="M 1078 440 L 1078 408 Q 1078 384 1024 376 L 1008 318" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#rA)"/>
    <text x="1000" y="522" font-size="15.5" font-weight="700" fill="#991b1b" text-anchor="middle">cannot engage</text>

    <g opacity="1">
      <rect x="1090" y="352" width="240" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.4"/>
      <text x="1210" y="382" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">adaptation bypasses</text>
      <text x="1210" y="404" font-size="13.5" fill="#92400e" text-anchor="middle">PB2 E627K · cattle M631L</text>
      <text x="1210" y="421" font-size="13.5" fill="#92400e" text-anchor="middle">+ PA K497R</text>
    </g>
    <path d="M 1210 352 L 1210 316" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#aA)"/>

    <rect x="760" y="540" width="250" height="72" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2.4"/>
    <text x="885" y="568" font-size="18" font-weight="900" fill="#7f1d1d" text-anchor="middle">✗ Restricted</text>
    <text x="885" y="592" font-size="13" fill="#991b1b" text-anchor="middle">avian polymerase inactive</text>
    <rect x="1030" y="540" width="300" height="72" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.4"/>
    <text x="1180" y="568" font-size="18" font-weight="900" fill="#713f12" text-anchor="middle">⚠ Mammalian replication</text>
    <text x="1180" y="592" font-size="13" fill="#854d0e" text-anchor="middle">E627K ≫ avian baseline [matthew2025]</text>
  </g>

  <!-- ============ EVIDENCE STRIP ============ -->
  <g id="evidence">
    <rect x="40" y="668" width="1320" height="136" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="700" font-size="14.5" font-weight="700" fill="#0f172a">Key evidence</text>
    <text x="64" y="724" font-size="12.5" fill="#334155">• ANP32A/B/E triple-KO cells: only chicken ANP32A robustly supports avian AIV07 and the cattle/Texas minimal precursor [pb2_cattle_adaptation2026]</text>
    <text x="64" y="746" font-size="12.5" fill="#334155">• Human minireplicon: PB2 E627K in the euDG 2.3.4.4b background raises activity far above native and above reconstructed bovine B3.13 [matthew2025]</text>
    <text x="64" y="768" font-size="12.5" fill="#334155">• Cattle B3.13: PB2 M631L fixed in all sequences; avian-like ancestor ~10× less active than wild type [pb2_cattle_adaptation2026]</text>
    <text x="64" y="792" font-size="11" fill="#94a3b8">Figure: fig-anp32a-species-barrier (v2) · icons: NIH BioArt (public domain) · influenza virus: SciDraw, CC0 (recolored)</text>
  </g>
</svg>

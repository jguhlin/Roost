<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <!-- Fig: B3.13 vs D1.1 — which lineage is cattle-adapted?
       Briefing: is-d11-or-b313-the-cattle-adapted-lineage-and-what-does-that-tell-us -->
  <defs>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#f8fafc"/>
  <text x="40" y="54" font-size="27" font-weight="bold" fill="#0f172a">B3.13 is the cattle-adapted lineage; D1.1 is a later, independent spillover</text>
  <text x="40" y="84" font-size="16" fill="#475569">Both are H5N1 clade 2.3.4.4b — but they entered dairy cattle independently and adapted differently at the polymerase.</text>

  <g id="b313-card">
    <rect x="40" y="120" width="650" height="480" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <path d="M 40 172 L 40 140 Q 40 120 60 120 L 670 120 Q 690 120 690 140 L 690 172 Z" fill="#dcfce7"/>
    <text x="365" y="153" font-size="21" font-weight="bold" fill="#14532d" text-anchor="middle">B3.13 — ESTABLISHED CATTLE LINEAGE</text>

    <text x="70" y="212" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">First detected</tspan>  Texas, February 2024 [cattle_mbio2024]</text>
    <text x="70" y="240" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Spread</tspan>  13 states by July 2024 [global_panzootic_mammals_2024]</text>
    <text x="70" y="268" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Source</tspan>  single wild-bird introduction, sustained cow-to-cow</text>
    <text x="70" y="296" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Transmission</tspan>  milking equipment, lateral spread; mammary tropism</text>

    <rect x="70" y="322" width="590" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
    <text x="90" y="348" font-size="15" font-weight="bold" fill="#14532d">NON-CANONICAL adaptation signature</text>
    <text x="90" y="374" font-size="14" fill="#166534">PB2 M631L — fixed in ALL cattle B3.13 sequences; key early</text>
    <text x="90" y="396" font-size="14" fill="#166534">mammalian adaptation (avian-like ancestor ~10× less active)</text>
    <text x="90" y="418" font-size="14" fill="#166534">+ PA K497R; HA/MP/NS variants [mostafa_h5n1_us_2025]</text>

    <rect x="70" y="478" width="590" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="365" y="510" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">✓ cattle-adapted WITHOUT PB2 E627K</text>
    <text x="365" y="536" font-size="13.5" fill="#166534" text-anchor="middle">M631L adapts the polymerase to bovine ANP32 factors</text>
    <text x="365" y="558" font-size="13.5" fill="#166534" text-anchor="middle">[pb2_cattle_adaptation2026]</text>
  </g>

  <g id="d11-card">
    <rect x="710" y="120" width="650" height="480" rx="20" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <path d="M 710 172 L 710 140 Q 710 120 730 120 L 1340 120 Q 1360 120 1360 140 L 1360 172 Z" fill="#fef3c7"/>
    <text x="1035" y="153" font-size="21" font-weight="bold" fill="#78350f" text-anchor="middle">D1.1 — LATER INDEPENDENT SPILLOVER</text>

    <text x="740" y="212" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">First detected</tspan>  Wisconsin bulk milk, 2025 [wisconsin_cattle_2025]</text>
    <text x="740" y="240" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Source</tspan>  closely related to local avian D1.1 viruses</text>
    <text x="740" y="268" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Spread</tspan>  no sustained cattle-to-cattle chain documented</text>
    <text x="740" y="296" font-size="14.5" fill="#334155"><tspan font-weight="bold" fill="#0f172a">Isolate</tspan>  A/dairy cow/Wisconsin/25G05743-001/2025</text>

    <rect x="740" y="322" width="590" height="120" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
    <text x="760" y="348" font-size="15" font-weight="bold" fill="#78350f">CLASSIC mammalian marker, de novo</text>
    <text x="760" y="374" font-size="14" fill="#92400e">PB2 E627K acquired on spillover into the cow</text>
    <text x="760" y="396" font-size="14" fill="#92400e">+ three additional amino-acid changes vs the</text>
    <text x="760" y="418" font-size="14" fill="#92400e">related Wisconsin avian D1.1 viruses</text>

    <rect x="740" y="478" width="590" height="104" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="1035" y="510" font-size="16" font-weight="bold" fill="#78350f" text-anchor="middle">⚠ second, independent entry — different route</text>
    <text x="1035" y="536" font-size="13.5" fill="#92400e" text-anchor="middle">same destination (mammalian polymerase function),</text>
    <text x="1035" y="558" font-size="13.5" fill="#92400e" text-anchor="middle">different mutation: E627K vs M631L</text>
  </g>

  <g id="convergence">
    <rect x="40" y="624" width="1320" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="64" y="654" font-size="15" font-weight="bold" fill="#0f172a">The takeaway — convergence at the polymerase·ANP32 interface</text>
    <text x="64" y="680" font-size="13.5" fill="#334155">Two genotypes reached mammalian polymerase function in cattle by different mutations — E627K (canonical) vs M631L (bovine-tuned).</text>
    <text x="64" y="702" font-size="13.5" fill="#334155">Sustained cattle adaptation is lineage-specific: B3.13's fixed M631L + spread contrasts with D1.1's dead-end-with-markers profile.</text>
    <text x="64" y="724" font-size="13.5" fill="#334155">Surveillance implication: screen dairy isolates for BOTH signatures; either signals independent mammalian adaptation.</text>
    <text x="64" y="742" font-size="12" fill="#94a3b8">Figure: fig-cattle-lineages · sources: briefing corpus (see page)</text>
  </g>
</svg>
